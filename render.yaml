# ==============================================================================
# NutriHer Render Infrastructure-as-Code Blueprint
# ==============================================================================
# Deploy both Backend & Frontend on Render with 1 click:
# https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # 1. FastAPI Python Backend
  - type: web
    name: nutriher-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /docs
    envVars:
      - key: PORT
        value: 8000

  # 2. React + Vite Frontend
  - type: web
    name: nutriher-frontend
    runtime: static
    rootDir: nutriher-frontend/nutriher-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    region: oregon
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: nutriher-api
          property: host
